name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"  # Автоматическое обновление каждый день в 3:00 UTC
  workflow_dispatch:       # Возможность запустить обновление вручную

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Генерируем главную карточку со статистикой
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=demonided&show_icons=true&theme=dark&bg_color=0d1117&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Генерируем карточку с используемыми языками
      - name: Generate top languages card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: top-langs
          options: username=demonided&layout=compact&theme=dark&bg_color=0d1117&hide_border=true&langs_count=6
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # Сохраняем сгенерированные картинки в репозиторий
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
