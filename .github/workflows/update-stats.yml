name: "📊 Update GitHub Metrics"

on:
  schedule:
    # Автоматическое обновление каждый день в 3:00 UTC
    - cron: "0 3 * * *"
  # Возможность запустить обновление вручную
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Файлы будут сохранены в папку ./metrics/
          output_action: write
          commit_message: "chore: update github metrics"
          committer_name: "github-actions[bot]"
          committer_email: "41898282+github-actions[bot]@users.noreply.github.com"

          # --- Настройки плагинов ---
          # Базовый плагин для общей статистики
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Плагин для отображения используемых языков
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_limit: 8

          # Плагин для графика активности
          plugin_activity: yes
          plugin_activity_limit: 5